<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <defs>
    <!-- Orange Gradient for Pin Outer Shape -->
    <linearGradient id="atsOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="60%" stop-color="#F57016" />
      <stop offset="100%" stop-color="#E45305" />
    </linearGradient>

    <!-- Teal Gradient for Swooshes -->
    <linearGradient id="atsTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#287898" />
      <stop offset="50%" stop-color="#1C5E7A" />
      <stop offset="100%" stop-color="#144A62" />
    </linearGradient>

    <filter id="atsDropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <g id="ats-mark" transform="translate(10, 0)">
    <!-- Bottom sharp pointer / pin tip -->
    <polygon points="110,130 92,204 128,145" fill="#E45305" />
    <polygon points="105,145 92,204 116,155" fill="#1C5E7A" />

    <!-- Top Left Wing / Needle -->
    <polygon points="40,36 12,50 65,70" fill="#1C5E7A" />

    <!-- Top Right Wing / Needle -->
    <polygon points="180,36 214,50 155,70" fill="#1C5E7A" />

    <!-- Main Orange Circular Body -->
    <circle cx="110" cy="100" r="75" fill="url(#atsOrangeGrad)" />

    <!-- Left Teal Inner Swoosh -->
    <path d="M 52,90 C 50,55 85,38 110,38 C 90,52 82,75 88,102 C 92,120 105,135 120,145 C 90,145 60,122 52,90 Z" fill="url(#atsTealGrad)" />

    <!-- Right/Upper Teal Swoosh -->
    <path d="M 168,90 C 170,55 135,38 110,38 C 130,52 142,75 136,102 C 130,125 110,142 95,148 C 132,150 162,125 168,90 Z" fill="url(#atsTealGrad)" />

    <!-- Central White Globe -->
    <circle cx="110" cy="100" r="26" fill="#FFFFFF" stroke="#F57016" stroke-width="1.8" />

    <!-- Globe Grid Lines (Orange) -->
    <!-- Equator and parallels -->
    <line x1="84" y1="100" x2="136" y2="100" stroke="#F57016" stroke-width="1.2" />
    <ellipse cx="110" cy="92" rx="23" ry="7" fill="none" stroke="#F57016" stroke-width="1" />
    <ellipse cx="110" cy="108" rx="23" ry="7" fill="none" stroke="#F57016" stroke-width="1" />
    
    <!-- Longitude meridians -->
    <line x1="110" y1="74" x2="110" y2="126" stroke="#F57016" stroke-width="1.2" />
    <ellipse cx="110" cy="100" rx="14" ry="26" fill="none" stroke="#F57016" stroke-width="1.1" />
    <ellipse cx="110" cy="100" rx="7" ry="26" fill="none" stroke="#F57016" stroke-width="1" />
  </g>

  <!-- Typography: ATS in Petrol Blue -->
  <g id="ats-text" fill="#1C5E7A" transform="translate(240, 0)">
    <!-- Letter A -->
    <path d="M 36,155 L 72,40 L 98,40 L 134,155 L 105,155 L 97,126 L 68,126 L 60,155 Z M 73,105 L 92,105 L 82.5,68 Z" />

    <!-- Letter T -->
    <path d="M 135,40 L 225,40 L 225,64 L 194,64 L 194,155 L 166,155 L 166,64 L 135,64 Z" />

    <!-- Letter S -->
    <path d="M 235,124 C 236,143 252,158 277,158 C 302,158 320,144 320,125 C 320,95 244,98 244,68 C 244,52 258,40 276,40 C 298,40 314,52 316,72 L 289,72 C 288,64 282,59 275,59 C 266,59 260,63 260,70 C 260,94 336,92 336,125 C 336,148 316,161 277,161 C 242,161 221,143 220,124 Z" />

    <!-- Subtitle: ADVANCED TECHNOLOGY SOLUTIONS -->
    <text x="0" y="190" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" letter-spacing="4.5" fill="#1C5E7A">
      ADVANCED TECHNOLOGY SOLUTIONS
    </text>
  </g>
</svg>
